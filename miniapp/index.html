<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PantaPredict</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="app">
    <h1>PantaPredict</h1>

    <form id="create-form">
      <label>
        Question
        <input type="text" id="question" required />
      </label>

      <label>
        Deadline
        <input type="date" id="deadline" required />
      </label>

      <label>
        Source (URL)
        <input type="url" id="source" required />
      </label>

      <div id="quality-checks"></div>

      <button type="button" id="check-btn">Check quality</button>
      <button type="submit" id="connect-btn" disabled>
        Connect wallet &amp; create
      </button>
    </form>

    <section id="market-view" hidden>
      <!-- Layer 6: populated when opened via a "Trade" button -->
    </section>
  </main>

  <!-- Mandatory per Panta API Terms of Use §6 — do not remove -->
  <footer>Powered by Panta</footer>

  <script src="app.js"></script>
</body>
</html>
