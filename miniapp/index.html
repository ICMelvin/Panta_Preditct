<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PantaPredict</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
  <script src="https://unpkg.com/bs58@5.0.0/dist/bs58.min.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="app">
    <h1>PantaPredict</h1>

    <form id="create-form">
      <label>
        Question
        <input type="text" id="question" required placeholder="Will Bitcoin reach $100k by end of 2026?" />
      </label>

      <label>
        Resolution Rule
        <textarea id="resolution_rule" required placeholder="How will this be resolved? (e.g., Bitcoin reaches $100,000 USD at any point before December 31, 2026, according to CoinMarketCap data)"></textarea>
      </label>

      <label>
        Sources of Truth (URLs, one per line)
        <textarea id="sources_of_truth" required placeholder="https://coinmarketcap.com&#10;https://coingecko.com"></textarea>
      </label>

      <label>
        Category
        <select id="category" required>
          <option value="">Loading categories...</option>
        </select>
      </label>

      <label>
        Image
        <select id="image_select">
          <option value="">Select an image</option>
          <option value="https://images.unsplash.com/photo-1518546305927-5a555bb7020d?w=400">Bitcoin/Crypto</option>
          <option value="https://images.unsplash.com/photo-1621761191319-c6fb62004040?w=400">Sports</option>
          <option value="https://images.unsplash.com/photo-1529107386315-e1a2ed48a620?w=400">Politics</option>
          <option value="https://images.unsplash.com/photo-1611974765270-ca1258634369?w=400">Technology</option>
        </select>
        <input type="url" id="image_url" placeholder="Or enter custom image URL" />
      </label>

      <label>
        End Date
        <input type="date" id="end_date" required />
      </label>

      <label>
        Resolution Date
        <input type="date" id="resolution_date" required />
      </label>

      <div id="quality-checks"></div>

      <button type="button" id="check-btn">Check quality</button>
      <button type="submit" id="connect-btn" disabled>
        Connect wallet &amp; create
      </button>
    </form>

    <section id="market-view" hidden>
      <h2>Market Details</h2>
      <div id="market-details"></div>
      <button id="back-btn">Back to create</button>
    </section>
  </main>

  <!-- Mandatory per Panta API Terms of Use §6 — do not remove -->
  <footer>Powered by Panta</footer>

  <script src="app.js"></script>
</body>
</html>
